services:
  swatcher-db:
    image: postgres:16-alpine
    container_name: swatcher-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-swatcher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-swatcher_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Performance tuning optimized for AWS EC2 (e.g. t3.xlarge: 4 vCPU, 16GB RAM)
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c max_connections=150
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-swatcher} -d ${DB_NAME:-swatcher_db}"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - swatcher-network

  swatcher-app:
    build:
      context: ./swatcher-server
      dockerfile: Dockerfile
    container_name: swatcher-app
    restart: unless-stopped
    depends_on:
      swatcher-db:
        condition: service_healthy
    environment:
      PORT: 9090
      DATABASE_URL: postgres://${DB_USER:-swatcher}:${DB_PASSWORD}@swatcher-db:5432/${DB_NAME:-swatcher_db}
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}
    ports:
      - "${BIND_IP:-0.0.0.0}:${PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - swatcher-network

volumes:
  postgres_data:
    name: swatcher_postgres_data

networks:
  swatcher-network:
    name: swatcher_network
    driver: bridge

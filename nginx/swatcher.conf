# ==============================================================================
# swatcher Production Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/conf.d/swatcher.conf
# ==============================================================================

# Rate limiting zone for burst protection (optional)
limit_req_zone $binary_remote_addr zone=swatcher_limit:10m rate=50r/s;

upstream swatcher_backend {
    server 127.0.0.1:9090;
    keepalive 32;
}

# Redirect HTTP to HTTPS (uncomment when SSL certificate is active)
# server {
#     listen 80;
#     server_name swatcher.yourcompany.internal;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80 default_server;
    # listen 443 ssl http2;
    # server_name swatcher.yourcompany.internal;

    # SSL Certificate Paths (e.g. from AWS ACM, Let's Encrypt, or Corporate PKI)
    # ssl_certificate /etc/letsencrypt/live/swatcher.yourcompany.internal/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/swatcher.yourcompany.internal/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Crucial: Allow large HTTP batch traffic payloads from Burp Suite extensions
    client_max_body_size 50M;
    client_body_buffer_size 16M;

    # Proxy buffer tuning for fast multi-megabyte log downloads
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    location / {
        limit_req zone=swatcher_limit burst=100 nodelay;

        proxy_pass http://swatcher_backend;
        proxy_http_version 1.1;

        # Forward real client connection metadata
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future live telemetry)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for large batch traffic ingestion
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
